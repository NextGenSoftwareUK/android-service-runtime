name: Publish verified iOS 0.7.1 runtime
on:
  push:
    branches: [oasis/holochain-0.7]
    paths: ['.github/workflows/publish-verified-ios.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-ios-0.7.1-verified
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/oasis/holochain-0.7'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCER: '38811394578'
      SOURCE: b01c4faa88db8d9a81e224789b2e5b23b8dca07f
      TAG: oasis-ios-conductor-v0.7.1
    steps:
      - name: Verify successful exact-source producer
        run: |
          gh api repos/$GH_REPO/actions/runs/$PRODUCER > run.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('run.json'))
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']==os.environ['SOURCE']
          assert r['path']=='.github/workflows/ios-conductor.yml'
          PY
      - name: Reuse retained producer artifacts without rebuilding
        run: gh run download "$PRODUCER" --name HolochainConductor-ios --dir verified
      - name: Verify exact runtime and archive content
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('verified'); m=json.loads((p/'build-manifest.json').read_text())
          assert m['commit']==os.environ['SOURCE'] and m['holochainVersion']=='0.7.1'
          assert set(m['targets'])=={'aarch64-apple-ios','aarch64-apple-ios-sim'}
          expected={
            'HolochainConductor.xcframework.zip':('xcframeworkSha256','0696cc389525fd3cd33e5c4a31f8b17e3b740b99da114dd41bd9d0fbbdc985f9'),
            'HolochainConductorSwift.zip':('swiftBindingsSha256','5779335916d6796a5edb7117eed4bb61e4df4a8f93edc3314962f0645e47be8b')}
          for name,(field,value) in expected.items():
              assert m[field]==value and hashlib.sha256((p/name).read_bytes()).hexdigest()==value
          print('Verified producer, exact version, device/simulator targets and both archive hashes.')
          PY
          sha256sum verified/*
      - name: Publish new immutable release assets
        run: |
          # Never replace an existing release or asset. A retry requires reconciliation.
          gh api repos/$GH_REPO/releases?per_page=100 > releases.json
          python3 - <<'PY'
          import json,os
          assert not any(r['tag_name']==os.environ['TAG'] for r in json.load(open('releases.json'))), 'Release already exists; reconcile, never overwrite.'
          PY
          gh release create "$TAG" --target "$SOURCE" --title 'Holochain 0.7.1 iOS runtime' --notes 'Device ARM64 and Apple-silicon simulator builds; conductor and Unity C-ABI simulator smoke tests passed in run 38811394578. Physical iPhone acceptance is not claimed.' verified/HolochainConductor.xcframework.zip verified/HolochainConductorSwift.zip verified/build-manifest.json
